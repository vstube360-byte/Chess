<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#161512">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="./icon.png">
    <title>Chess</title>
</head>

<body>
    <div class="app-container">
        <!-- Main Game Area -->
        <main class="game-area">
            <!-- Top Player Bar -->
            <div class="player-bar top-bar">
                <div class="player-info">
                    <span class="player-name" id="top-player-name">Black</span>
                    <div class="captured-tray" id="top-captured"></div>
                    <span class="material-advantage" id="top-advantage"></span>
                </div>
                <div class="clock-badge" id="clock-top">10:00</div>
            </div>

            <!-- Opening Banner -->
            <div class="opening-banner" id="opening-banner" style="display: none;">
                <span class="opening-name" id="opening-name">Italian Game</span>
            </div>

            <!-- Board Area with Real-Time Engine Evaluation Bar -->
            <div class="board-with-eval" id="board-with-eval">
                <div class="eval-bar-wrapper" id="eval-bar-wrapper" title="Engine Evaluation">
                    <div class="eval-bar-inner">
                        <div class="eval-bar-fill" id="eval-bar-fill" style="height: 50%;"></div>
                        <span class="eval-bar-score" id="eval-bar-score">0.0</span>
                    </div>
                </div>

                <!-- Primary Board Wrapper with Touch Isolation -->
                <div class="board-column">
                    <div class="pov-badge" id="pov-badge-primary" style="display: none;">White POV</div>
                    <div class="board-wrapper">
                        <div class="board-container" id="board-container"></div>
                    </div>
                </div>

                <!-- Secondary Board Wrapper (Dual POV Side-by-Side View) -->
                <div class="board-column secondary-board-column" id="secondary-board-column" style="display: none;">
                    <div class="pov-badge" id="pov-badge-secondary">Black POV</div>
                    <div class="board-wrapper">
                        <div class="board-container" id="board-container-secondary"></div>
                    </div>
                </div>
            </div>

            <!-- Bottom Player Bar -->
            <div class="player-bar bottom-bar">
                <div class="player-info">
                    <span class="player-name" id="bottom-player-name">White</span>
                    <div class="captured-tray" id="bottom-captured"></div>
                    <span class="material-advantage" id="bottom-advantage"></span>
                </div>
                <div class="clock-badge active-clock" id="clock-bottom">10:00</div>
            </div>
        </main>

        <!-- Sidebar / Control Panel (Responsive for iPad) -->
        <aside class="sidebar">
            <!-- Quick Actions Toolbar -->
            <div class="toolbar">
                <button id="btn-new-game" class="tool-btn" title="Start New Game">New</button>
                <button id="btn-resign" class="tool-btn" title="Resign Game">Resign</button>
                <button id="btn-undo" class="tool-btn" title="Undo Move">Undo</button>
                <button id="btn-redo" class="tool-btn" title="Redo Move">Redo</button>
                <button id="btn-hint" class="tool-btn" title="Best Move Hint">Hint</button>
                <button id="btn-draw" class="tool-btn" title="Offer / Agree to Draw">Draw</button>
                <button id="btn-autoflip" class="tool-btn" title="Auto-flip on turn in Pass & Play">Auto</button>
                <button id="btn-flip-board" class="tool-btn" title="Flip Board">Flip</button>
                <button id="btn-dual-board" class="tool-btn" title="Dual Board View (Show both White & Black POV side-by-side)">2 Boards</button>
                <button id="btn-table-mode" class="tool-btn" title="Table Mode (180° Black piece rotation)">Table</button>
                <button id="btn-sound" class="tool-btn" title="Mute / Unmute"><span id="sound-label">Sound</span></button>
            </div>

            <!-- Offline Cache Button & Progress (Disappears once loaded offline) -->
            <div class="offline-box" id="offline-box">
                <button id="btn-load-offline" class="offline-btn" title="Download all bots, models, and game files into browser cache for offline play">
                    Download for Offline Use
                </button>
                <div class="offline-progress-container" id="offline-progress-container" style="display: none;">
                    <div class="offline-progress-header">
                        <span id="offline-progress-label">Saving to local cache...</span>
                        <span id="offline-progress-pct">0%</span>
                    </div>
                    <div class="offline-progress-track">
                        <div class="offline-progress-bar" id="offline-progress-bar" style="width: 0%;"></div>
                    </div>
                </div>
            </div>

            <!-- Game Settings -->
            <div class="settings-box">
                <div class="setting-row">
                    <label for="select-mode">Mode</label>
                    <select id="select-mode">
                        <option value="pass_and_play">Pass & Play (2 Players)</option>
                        <option value="vs_bot_white">Play vs Bot (You: White)</option>
                        <option value="vs_bot_black">Play vs Bot (You: Black)</option>
                        <option value="freeform">Freeform / Setup Board</option>
                    </select>
                </div>
                <div class="setting-row" id="row-difficulty" style="display: none;">
                    <label for="select-difficulty">Bot Level</label>
                    <select id="select-difficulty">
                        <option value="bot_400">Maia 1100 Casual (800 Elo)</option>
                        <option value="bot_700">Maia 1100 Relaxed (1000 Elo)</option>
                        <option value="bot_1000">Maia 1100 (1100 Elo)</option>
                        <option value="bot_1300">Maia 1300 (1300 Elo)</option>
                        <option value="bot_1600" selected>Maia 1500 (1500 Elo)</option>
                        <option value="bot_1900">Maia 1700 (1700 Elo)</option>
                        <option value="bot_2200">Maia 1900 (1900 Elo)</option>
                        <option value="bot_2500">Maia 1900 Sharp (2100 Elo)</option>
                        <option value="bot_2800">Stockfish Master (2600 Elo)</option>
                        <option value="bot_3000">Stockfish Engine (3000 Elo)</option>
                    </select>
                </div>
                <div class="setting-row" id="row-time">
                    <label for="select-time">Clock</label>
                    <select id="select-time">
                        <option value="180">3 min (Blitz)</option>
                        <option value="300">5 min (Blitz)</option>
                        <option value="600" selected>10 min (Rapid)</option>
                        <option value="900">15 min (Rapid)</option>
                        <option value="custom">Custom...</option>
                        <option value="0">Unlimited (No Timer)</option>
                    </select>
                </div>
                <div class="setting-row">
                    <label for="select-theme">Theme</label>
                    <select id="select-theme">
                        <option value="wood" selected>Classic Wood</option>
                        <option value="green">Tournament Green</option>
                        <option value="walnut">Warm Walnut</option>
                        <option value="blue">Ocean Blue</option>
                        <option value="purple">Royal Amethyst</option>
                        <option value="classic">Marble Classic</option>
                        <option value="dark">Dark Slate</option>
                    </select>
                </div>
                <div class="theme-swatches" id="theme-swatches" aria-label="Quick Board Theme">
                    <button type="button" class="theme-swatch active" data-theme="wood" title="Classic Wood"></button>
                    <button type="button" class="theme-swatch" data-theme="green" title="Tournament Green"></button>
                    <button type="button" class="theme-swatch" data-theme="walnut" title="Warm Walnut"></button>
                    <button type="button" class="theme-swatch" data-theme="blue" title="Ocean Blue"></button>
                    <button type="button" class="theme-swatch" data-theme="purple" title="Royal Amethyst"></button>
                    <button type="button" class="theme-swatch" data-theme="classic" title="Marble Classic"></button>
                    <button type="button" class="theme-swatch" data-theme="dark" title="Dark Slate"></button>
                </div>
            </div>

            <!-- Freeform Setup Editor Panel -->
            <div class="freeform-card" id="freeform-card" style="display: none;">
                <div class="history-header">
                    <span>Freeform Board Setup</span>
                    <span class="freeform-badge">Editor</span>
                </div>
                <div class="freeform-body">
                    <div class="editor-tools-row">
                        <button type="button" id="btn-tool-move" class="editor-tool-btn active" title="Move / Rearrange pieces onto empty squares">
                            Move
                        </button>
                        <button type="button" id="btn-tool-erase" class="editor-tool-btn" title="Tap any square to remove its piece">
                            Erase
                        </button>
                        <button type="button" id="btn-editor-start" class="editor-tool-btn" title="Reset to standard 32-piece starting board">
                            Reset
                        </button>
                        <button type="button" id="btn-editor-clear" class="editor-tool-btn" title="Clear board to only the two Kings">
                            Clear
                        </button>
                    </div>

                    <div class="palette-group">
                        <div class="palette-row" data-colour="w">
                            <button type="button" class="palette-piece-btn" data-piece="king" data-colour="w" title="Place White King"><img src="assets/king_w.png" alt="WK"></button>
                            <button type="button" class="palette-piece-btn" data-piece="queen" data-colour="w" title="Place White Queen"><img src="assets/queen_w.png" alt="WQ"></button>
                            <button type="button" class="palette-piece-btn" data-piece="rook" data-colour="w" title="Place White Rook"><img src="assets/rook_w.png" alt="WR"></button>
                            <button type="button" class="palette-piece-btn" data-piece="bishop" data-colour="w" title="Place White Bishop"><img src="assets/bishop_w.png" alt="WB"></button>
                            <button type="button" class="palette-piece-btn" data-piece="knight" data-colour="w" title="Place White Knight"><img src="assets/knight_w.png" alt="WN"></button>
                            <button type="button" class="palette-piece-btn" data-piece="pawn" data-colour="w" title="Place White Pawn"><img src="assets/pawn_w.png" alt="WP"></button>
                        </div>
                        <div class="palette-row" data-colour="b">
                            <button type="button" class="palette-piece-btn" data-piece="king" data-colour="b" title="Place Black King"><img src="assets/king_b.png" alt="BK"></button>
                            <button type="button" class="palette-piece-btn" data-piece="queen" data-colour="b" title="Place Black Queen"><img src="assets/queen_b.png" alt="BQ"></button>
                            <button type="button" class="palette-piece-btn" data-piece="rook" data-colour="b" title="Place Black Rook"><img src="assets/rook_b.png" alt="BR"></button>
                            <button type="button" class="palette-piece-btn" data-piece="bishop" data-colour="b" title="Place Black Bishop"><img src="assets/bishop_b.png" alt="BB"></button>
                            <button type="button" class="palette-piece-btn" data-piece="knight" data-colour="b" title="Place Black Knight"><img src="assets/knight_b.png" alt="BN"></button>
                            <button type="button" class="palette-piece-btn" data-piece="pawn" data-colour="b" title="Place Black Pawn"><img src="assets/pawn_b.png" alt="BP"></button>
                        </div>
                    </div>

                    <div class="freeform-launch-options">
                        <div class="setting-row">
                            <label for="select-editor-turn">First Turn</label>
                            <select id="select-editor-turn">
                                <option value="w" selected>White to Move</option>
                                <option value="b">Black to Move</option>
                            </select>
                        </div>
                        <div class="setting-row">
                            <label for="select-editor-playmode">Play Mode</label>
                            <select id="select-editor-playmode">
                                <option value="pass_and_play" selected>Pass & Play (2 Players)</option>
                                <option value="vs_bot_white">Play vs Bot (You: White)</option>
                                <option value="vs_bot_black">Play vs Bot (You: Black)</option>
                            </select>
                        </div>
                    </div>

                    <button type="button" id="btn-play-from-here" class="play-from-here-btn">
                        Play From Here
                    </button>
                </div>
            </div>

            <!-- Move History -->
            <div class="history-card" id="history-card">
                <div class="history-header">
                    <span>Moves</span>
                    <div class="history-nav">
                        <button id="btn-nav-first" class="nav-btn" title="Start Position (Home)">⏮</button>
                        <button id="btn-nav-prev" class="nav-btn" title="Previous Move (Left Arrow)">◀</button>
                        <button id="btn-nav-next" class="nav-btn" title="Next Move (Right Arrow)">▶</button>
                        <button id="btn-nav-last" class="nav-btn" title="Latest Position (End)">⏭</button>
                    </div>
                    <button id="btn-copy-pgn" class="mini-btn" title="Copy PGN text">Copy PGN</button>
                </div>
                <div class="notation-list" id="notation-list"></div>
            </div>

            <!-- Game Status -->
            <div class="status-bar" id="status-bar">
                White to move
            </div>
        </aside>
    </div>

    <!-- Custom Time Dialog Modal -->
    <div id="modal-custom-time" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <h3 class="modal-title">Custom Timer</h3>
            <p class="modal-subtitle">Enter game duration in minutes per player (1 to 180):</p>
            <div class="modal-input-row">
                <input type="number" id="input-custom-minutes" min="1" max="180" value="10" />
                <span class="modal-unit">min</span>
            </div>
            <div class="modal-actions">
                <button id="btn-custom-cancel" class="modal-btn cancel">Cancel</button>
                <button id="btn-custom-set" class="modal-btn apply">Apply</button>
            </div>
        </div>
    </div>

    <!-- Draw Offer Modal -->
    <div id="modal-draw-offer" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <h3 class="modal-title">Draw Offer</h3>
            <p class="modal-subtitle" id="draw-offer-text">A draw has been offered. Do you accept?</p>
            <div class="modal-actions">
                <button id="btn-draw-decline" class="modal-btn cancel">Decline</button>
                <button id="btn-draw-accept" class="modal-btn apply">Accept Draw</button>
            </div>
        </div>
    </div>

    <script src="./ort.min.js"></script>
    <script type="module" src="./main.js"></script>
</body>

</html>
